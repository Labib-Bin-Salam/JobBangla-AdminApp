// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Capacitor 7.3+ ships `capacitor-android` with sourceCompatibility 21, which
// needs JDK 21. Pin every Android module to 17 so the project builds on JDK 17
// (same as ../../android). Remove if the build host moves to JDK 21.
subprojects {
    afterEvaluate { project ->
        def android = project.extensions.findByName('android')
        if (android != null) {
            android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
}
