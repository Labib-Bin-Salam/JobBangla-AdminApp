<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Job Bangla Control</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0D1B3D; color: #E8ECF5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; }
      .name { font-size: 20px; font-weight: 700; }
      .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,.25);
        border-top-color: #4F7CFF; border-radius: 50%; animation: spin .9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap"><div class="name">Job Bangla Control</div><div class="spinner"></div></div>
    <script>
      // Only a fallback: the native layer loads server.url directly.
      setTimeout(function () { try { window.location.replace('https://admin.jobbangla.bd'); } catch (e) {} }, 2500);
    </script>
  </body>
</html>
