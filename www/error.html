<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Job Bangla Control</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0D1B3D;
        color: #E8ECF5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 14px;
        padding: 0 32px;
      }
      .name { font-size: 20px; font-weight: 700; }
      .msg { font-size: 14px; opacity: 0.75; line-height: 1.5; max-width: 320px; }
      button {
        margin-top: 8px;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: #4F7CFF;
        border: 0;
        border-radius: 10px;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="name">Job Bangla Control</div>
      <div class="msg">
        Couldn&rsquo;t reach the server. Check your internet connection and try
        again.
      </div>
      <button id="retry" type="button">Retry</button>
    </div>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        window.location.replace('https://admin.jobbangla.bd');
      });
    </script>
  </body>
</html>
